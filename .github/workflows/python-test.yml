name: Python Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Lint with flake8
        run: |
          pip install flake8
          # 仅检查严重错误
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # 所有检查但设为退出码0（仅报告）
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test imports
        run: |
          python -c "import app"
          python -c "from converters import batch, pdf_converter, word_converter"
          python -c "from core import config, constants, converter_facade"
          python -c "from workers import convert_worker"

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short
        continue-on-error: true # PySide6 在无显示器环境可能失败

      - name: Check script syntax
        run: |
          python -m py_compile app.py
          python -c "import glob, py_compile; [py_compile.compile(f, doraise=True) for f in glob.glob('converters/*.py')]"
          python -c "import glob, py_compile; [py_compile.compile(f, doraise=True) for f in glob.glob('core/*.py')]"
          python -c "import glob, py_compile; [py_compile.compile(f, doraise=True) for f in glob.glob('workers/*.py')]"

  build-check:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check install scripts
        run: |
          chmod +x install.sh
          bash -n install.sh
          bash -n start.sh
